# Mosquitto 2.x – development configuration for Smart Garden.
listener 1883 0.0.0.0
protocol mqtt

# DEVELOPMENT ONLY: anonymous clients are allowed.
# To require username/password (see README "Seguridad MQTT"):
#   1. docker compose exec mosquitto mosquitto_passwd -c -b /mosquitto/config/passwd <user> <password>
#   2. Set allow_anonymous false and uncomment password_file below.
#   3. Set MQTT_USERNAME / MQTT_PASSWORD in .env and restart.
allow_anonymous true
#password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
