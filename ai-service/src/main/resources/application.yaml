spring:
  application:
    name: ai-service
  profiles:
    default: local
  config:
    # Running from the IDE: read KEY=VALUE pairs from smart-garden-backend/.env (never committed).
    # Real environment variables take precedence; in Docker the file is not present.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  # Supabase PostgreSQL: este servicio tiene SU PROPIO proyecto (servidor PostgreSQL independiente).
  # Session pooler en el puerto 5432 (soporta los prepared statements de Hibernate). La base del proyecto
  # siempre se llama "postgres"; lo que cambia por servicio es el host y el usuario del pooler.
  # Se mantiene el esquema propio ("ai") en vez de "public": Supabase expone "public" por su Data API y
  # las tablas sin RLS quedarían accesibles; además Flyway e Hibernate siguen igual (schemas/default-schema).
  datasource:
    url: jdbc:postgresql://${AI_DB_HOST}:5432/postgres?sslmode=require&currentSchema=ai
    username: ${AI_DB_USER}
    password: ${AI_DB_PASSWORD}
    hikari:
      # Cada proyecto tiene su propio pooler: 5 conexiones por servicio.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      keepalive-time: 300000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: ai
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: ai
    default-schema: ai
    create-schemas: true
  grpc:
    server:
      port: 9093
      shutdown:
        grace-period: 5s
      # Allow client keepalive pings on long-lived streams.
      keepalive:
        permit:
          time: 20s
          without-calls: true
    client:
      channel:
        telemetry:
          target: ${TELEMETRY_GRPC_TARGET:static://localhost:9091}
        irrigation:
          target: ${IRRIGATION_GRPC_TARGET:static://localhost:9092}
  ai:
    google:
      genai:
        # Google AI Studio key (free tier). Never hard-code it.
        api-key: ${GEMINI_API_KEY:}
        chat:
          # A Gemini "Flash" model (free tier).
          model: ${GEMINI_MODEL:gemini-3.8-flash}
          temperature: 0.2
          response-mime-type: application/json
    retry:
      # Free tier: exactly one Gemini call per analysis (no automatic retries).
      max-attempts: 0

server:
  # Management only (Actuator); the business API is gRPC on 9093.
  port: 8083

management:
  endpoints:
    web:
      exposure:
        # health para los healthchecks; metrics/prometheus para Monitorizar (Prometheus/Grafana)
        include: health,info,metrics,prometheus

smartgarden:
  # Autenticación entre servicios (cabecera gRPC x-internal-token). Vacío = desactivada.
  internal-token: ${INTERNAL_TOKEN:}
  ai:
    analysis-interval: ${AI_ANALYSIS_INTERVAL:30m}
    analysis-initial-delay: ${AI_ANALYSIS_INITIAL_DELAY:2m}
    # RequestAnalysis can be called at most once per window (free-tier quota).
    manual-request-cooldown: 1m
    grpc-deadline: 5s
    # Max wait for Gemini per analysis, shared by all the models tried (the gateway waits up to 45 s).
    gemini-timeout: 25s
    # Tried in order, once each, when the main model answers 503 (overloaded), 429 (quota) or 404.
    gemini-fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-flash-lite-latest}
  weather:
    base-url: https://api.open-meteo.com
    latitude: ${WEATHER_LAT:4.711}
    longitude: ${WEATHER_LON:-74.0721}
    timezone: America/Bogota
    cache-ttl: 10m
    # Rain probability (%) above which the rule-based fallback pauses irrigation.
    rain-pause-threshold: 70

logging:
  level:
    com.smartgarden: INFO

