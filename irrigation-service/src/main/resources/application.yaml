spring:
  application:
    name: irrigation-service
  profiles:
    default: local
  config:
    # Running from the IDE: read KEY=VALUE pairs from smart-garden-backend/.env (never committed).
    # Real environment variables take precedence; in Docker the file is not present.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  # Supabase PostgreSQL: este servicio tiene SU PROPIO proyecto (servidor PostgreSQL independiente).
  # Session pooler en el puerto 5432 (soporta los prepared statements de Hibernate). La base del proyecto
  # siempre se llama "postgres"; lo que cambia por servicio es el host y el usuario del pooler.
  # Se mantiene el esquema propio ("irrigation") en vez de "public": Supabase expone "public" por su Data API y
  # las tablas sin RLS quedarían accesibles; además Flyway e Hibernate siguen igual (schemas/default-schema).
  datasource:
    url: jdbc:postgresql://${IRRIGATION_DB_HOST}:5432/postgres?sslmode=require&currentSchema=irrigation
    username: ${IRRIGATION_DB_USER}
    password: ${IRRIGATION_DB_PASSWORD}
    hikari:
      # Cada proyecto tiene su propio pooler: 5 conexiones por servicio.
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      keepalive-time: 300000
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: irrigation
    hibernate:
      # Flyway owns the schema; Hibernate only validates it.
      ddl-auto: validate
  flyway:
    enabled: true
    schemas: irrigation
    default-schema: irrigation
    create-schemas: true
  grpc:
    server:
      port: ${PORT:9092}
      shutdown:
        grace-period: 5s
      # Allow client keepalive pings on long-lived streams.
      keepalive:
        permit:
          time: 20s
          without-calls: true
    client:
      channel:
        telemetry:
          # Plaintext HTTP/2 (h2c). TLS: see README "gRPC con TLS".
          target: ${TELEMETRY_GRPC_TARGET:static://localhost:9091}

server:
  # Management only (Actuator); the business API is gRPC on 9092.
  port: 8082

management:
  endpoints:
    web:
      exposure:
        # health para los healthchecks; metrics/prometheus para Monitorizar (Prometheus/Grafana)
        include: health,info,metrics,prometheus

smartgarden:
  # Autenticación entre servicios (cabecera gRPC x-internal-token). Vacío = desactivada.
  internal-token: ${INTERNAL_TOKEN:}
  irrigation:
    # Deadline for calls to telemetry-service.
    telemetry-deadline: 5s
    # Re-publish the retained CONFIG on startup so the broker always holds the latest one.
    publish-config-on-startup: true

logging:
  level:
    com.smartgarden: INFO

