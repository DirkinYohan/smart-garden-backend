# In-memory H2 (PostgreSQL mode) so tests do not need Docker. Flyway runs the real migrations.
spring:
  datasource:
    url: jdbc:h2:mem:irrigation_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none

smartgarden:
  # En tests no hay autenticación entre servicios
  internal-token: ""
  irrigation:
    publish-config-on-startup: false
