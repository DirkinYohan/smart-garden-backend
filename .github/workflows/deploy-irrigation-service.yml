# Independent deployment of irrigation-service: runs ONLY when its code, the gRPC contracts or the shared module change.
# Tests -> image ghcr.io/<owner>/smart-garden-irrigation-service:<commit sha> -> updates ONLY the irrigation-service Container App.
name: Deploy irrigation-service

on:
  push:
    branches: [main]
    paths:
      - 'irrigation-service/**'
      - 'grpc-contracts/**'
      - 'common/**'
      - 'pom.xml'
      - '.github/workflows/deploy-irrigation-service.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-irrigation-service
  cancel-in-progress: false

env:
  SERVICE: irrigation-service
  RESOURCE_GROUP: smart-garden-aca-rg

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y probar irrigation-service
        run: ./mvnw -B -pl ${{ env.SERVICE }} -am verify

      - name: Nombre de la imagen
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-garden-${SERVICE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y subir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.SERVICE }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ env.SERVICE }}
          cache-to: type=gha,mode=max,scope=${{ env.SERVICE }}

      # OpenID Connect: no Azure password stored in GitHub (only the ids, as GitHub Secrets).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar SOLO la Container App irrigation-service
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp update -g "$RESOURCE_GROUP" -n "$SERVICE" --image "${{ steps.image.outputs.ref }}"             --query "{revision:properties.latestRevisionName, image:properties.template.containers[0].image}" -o table
