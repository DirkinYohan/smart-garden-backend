# Independent deployment of the job image (grpcurl + contracts) used by the scheduled AI analysis.
name: Deploy ai-scheduler

on:
  push:
    branches: [main]
    paths:
      - 'infra/azure/scheduler/**'
      - 'grpc-contracts/src/main/protobuf/**'
      - '.github/workflows/deploy-ai-scheduler.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: deploy-ai-scheduler
  cancel-in-progress: false

env:
  RESOURCE_GROUP: smart-garden-aca-rg
  JOB: ai-scheduled-analysis

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de la imagen
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/smart-garden-ai-scheduler:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/azure/scheduler/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.ref }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar SOLO el job
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp job update -g "$RESOURCE_GROUP" -n "$JOB" --image "${{ steps.image.outputs.ref }}" -o none
