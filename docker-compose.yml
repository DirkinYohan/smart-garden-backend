name: smart-garden

# Databases: one Supabase project per service (database-per-service); credentials from .env.
# Everything:            docker compose up --build
# Broker only (IDE):     docker compose up -d mosquitto
# Offline local DB:      SPRING_PROFILES_ACTIVE=docker,localdb docker compose --profile local-db up --build

# Cada servicio recibe únicamente las credenciales de SU proyecto de Supabase (database-per-service).
x-service-env: &service-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  # Solo se usan con el perfil Spring "localdb"
  LOCAL_DB_HOST: postgres
  POSTGRES_USER: ${POSTGRES_USER:-smartgarden}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartgarden}
  TZ: America/Bogota
  # Testigo compartido para las llamadas gRPC internas (cabecera x-internal-token)
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:-}

services:
  # Respaldo sin Internet (no arranca por defecto): docker compose --profile local-db up
  # Crea 4 bases locales, una por servicio, igual que los 4 proyectos de Supabase.
  postgres:
    image: postgres:17-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartgarden}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartgarden}
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Crea una base por microservicio (gateway_db, telemetry_db, irrigation_db, ai_db)
      - ./infra/postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -t '$$SYS/broker/uptime' -C 1 -W 3 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  telemetry-service:
    build:
      context: .
      dockerfile: telemetry-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      # Su propio proyecto de Supabase (solo estas credenciales)
      TELEMETRY_DB_HOST: ${TELEMETRY_DB_HOST:-}
      TELEMETRY_DB_USER: ${TELEMETRY_DB_USER:-}
      TELEMETRY_DB_PASSWORD: ${TELEMETRY_DB_PASSWORD:-}
      MQTT_HOST: ${MQTT_HOST:-mosquitto}
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    ports:
      - "9091:9091"
    depends_on:
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  irrigation-service:
    build:
      context: .
      dockerfile: irrigation-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      IRRIGATION_DB_HOST: ${IRRIGATION_DB_HOST:-}
      IRRIGATION_DB_USER: ${IRRIGATION_DB_USER:-}
      IRRIGATION_DB_PASSWORD: ${IRRIGATION_DB_PASSWORD:-}
      TELEMETRY_GRPC_TARGET: static://telemetry-service:9091
    ports:
      - "9092:9092"
    depends_on:
      telemetry-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      AI_DB_HOST: ${AI_DB_HOST:-}
      AI_DB_USER: ${AI_DB_USER:-}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      TELEMETRY_GRPC_TARGET: static://telemetry-service:9091
      IRRIGATION_GRPC_TARGET: static://irrigation-service:9092
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-gemini-flash-lite-latest}
      WEATHER_LAT: ${WEATHER_LAT:-4.711}
      WEATHER_LON: ${WEATHER_LON:--74.0721}
    ports:
      - "9093:9093"
    depends_on:
      telemetry-service:
        condition: service_healthy
      irrigation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      <<: *service-env
      GATEWAY_DB_HOST: ${GATEWAY_DB_HOST:-}
      GATEWAY_DB_USER: ${GATEWAY_DB_USER:-}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:-}
      TELEMETRY_GRPC_TARGET: static://telemetry-service:9091
      IRRIGATION_GRPC_TARGET: static://irrigation-service:9092
      AI_GRPC_TARGET: static://ai-service:9093
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Recuperación de acceso (un solo arranque). Quitar la variable después de usarla.
      ADMIN_RESET_PASSWORD: ${ADMIN_RESET_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Swagger UI / OpenAPI: en producción ponlo a false
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      telemetry-service:
        condition: service_healthy
      irrigation-service:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10

volumes:
  postgres-data:
  mosquitto-data:
