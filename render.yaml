# Blueprint de Render para los 4 microservicios de Smart Garden.
#
# Cómo desplegar:
#   1. Render Dashboard > New + > Blueprint
#   2. Elige el repositorio smart-garden-backend (rama main)
#   3. Rellena las variables marcadas con sync: false
#
# El gateway es el ÚNICO servicio público (REST + WebSocket/STOMP).
# Los otros tres son "private services": solo se alcanzan desde la red privada de Render,
# que admite cualquier protocolo y puerto, así que el gRPC (h2c) funciona sin cambios.
#
# IMPORTANTE: INTERNAL_TOKEN debe ser el MISMO valor en los cuatro servicios.
# Los servicios gRPC exponen su puerto con la variable PORT; la dirección privada es
# <nombre-del-servicio>:<PORT>, por ejemplo smart-garden-telemetry:9091.

services:
  - type: web
    name: smart-garden-gateway
    buildFilter:
      paths:
        - api-gateway/**
        - grpc-contracts/**
        - common/**
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: INTERNAL_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: GATEWAY_DB_HOST
        sync: false
      - key: GATEWAY_DB_USER
        sync: false
      - key: GATEWAY_DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TELEMETRY_GRPC_TARGET
        value: static://smart-garden-telemetry:9091
      - key: IRRIGATION_GRPC_TARGET
        value: static://smart-garden-irrigation:9092
      - key: AI_GRPC_TARGET
        value: static://smart-garden-ai:9093

  - type: pserv
    name: smart-garden-telemetry
    buildFilter:
      paths:
        - telemetry-service/**
        - grpc-contracts/**
        - common/**
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./telemetry-service/Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: PORT
        value: "9091"
      - key: INTERNAL_TOKEN
        sync: false
      - key: TELEMETRY_DB_HOST
        sync: false
      - key: TELEMETRY_DB_USER
        sync: false
      - key: TELEMETRY_DB_PASSWORD
        sync: false
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        sync: false
      - key: MQTT_SCHEME
        value: ssl
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: GARDEN_TIMEZONE
        value: America/Bogota

  - type: pserv
    name: smart-garden-irrigation
    buildFilter:
      paths:
        - irrigation-service/**
        - grpc-contracts/**
        - common/**
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./irrigation-service/Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: PORT
        value: "9092"
      - key: INTERNAL_TOKEN
        sync: false
      - key: IRRIGATION_DB_HOST
        sync: false
      - key: IRRIGATION_DB_USER
        sync: false
      - key: IRRIGATION_DB_PASSWORD
        sync: false
      - key: TELEMETRY_GRPC_TARGET
        value: static://smart-garden-telemetry:9091

  - type: pserv
    name: smart-garden-ai
    buildFilter:
      paths:
        - ai-service/**
        - grpc-contracts/**
        - common/**
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: .
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: docker
      - key: PORT
        value: "9093"
      - key: INTERNAL_TOKEN
        sync: false
      - key: AI_DB_HOST
        sync: false
      - key: AI_DB_USER
        sync: false
      - key: AI_DB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEMETRY_GRPC_TARGET
        value: static://smart-garden-telemetry:9091
      - key: IRRIGATION_GRPC_TARGET
        value: static://smart-garden-irrigation:9092
      - key: AI_ANALYSIS_INTERVAL
        value: 30m
